<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIFQI NANDA | SYSTEM ASSEMBLY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        .hidden { display: none; }
        body { background-color: #050505; color: white; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        
        /* --- HIGH-TECH CAR ASSEMBLY LOADING --- */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
        }
        .loader-wrapper { width: 90%; max-width: 600px; text-align: center; }

        /* Siluet Wireframe Mobil */
        .car-wireframe {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 30px;
            position: relative;
        }

        .car-svg {
            stroke: #3b82f6;
            stroke-width: 0.5;
            fill: none;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawCar 6s ease-out forwards;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.7));
        }

        @keyframes drawCar {
            from { stroke-dashoffset: 1000; opacity: 0; }
            to { stroke-dashoffset: 0; opacity: 1; }
        }

        /* Scan Line Effect */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, transparent, rgba(59, 130, 246, 0.8), transparent);
            animation: scanning 2.5s linear infinite;
            filter: blur(2px);
        }

        @keyframes scanning {
            0% { top: 0%; opacity: 0; }
            5% { opacity: 1; }
            95% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .percentage-text { 
            font-size: 3.5rem; 
            font-weight: 800; 
            color: #fff; 
            letter-spacing: -2px;
            font-style: italic;
        }
        .percentage-text::after { content: '%'; font-size: 1.5rem; color: #3b82f6; vertical-align: super; }
        
        .status-text { 
            font-size: 0.7rem; 
            color: #555; 
            text-transform: uppercase; 
            letter-spacing: 5px;
            margin-top: 10px;
        }

        /* --- PAGE ANIMATIONS --- */
        .page-enter { animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- CARDS & DETAIL --- */
        .car-card { transition: all 0.4s ease; border: 1px solid rgba(255,255,255,0.05); }
        .car-card:hover { border-color: #3b82f6; transform: translateY(-5px); box-shadow: 0 10px 40px -10px rgba(59, 130, 246, 0.4); }
        
        #detail-page {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .overlay-dark {
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(5,5,5,1));
            min-height: 100vh;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader-wrapper">
            <div class="car-wireframe">
                <div class="scan-line"></div>
                <svg class="car-svg" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 30 L110 30 C115 30, 118 28, 118 25 L115 15 C114 12, 110 10, 105 10 L85 10 L75 5 L45 5 L35 10 L15 10 C10 10, 6 12, 5 15 L2 25 C2 28, 5 30, 10 30 Z" />
                    <path d="M35 10 L38 6 L72 6 L75 10" stroke-width="0.3"/> <circle cx="25" cy="30" r="7" stroke-width="0.3"/> <circle cx="95" cy="30" r="7" stroke-width="0.3"/> </svg>
            </div>
            <div id="count" class="percentage-text">0</div>
            <div id="status" class="status-text">SYSTEM ASSEMBLY INITIATED...</div>
        </div>
    </div>

    <div id="login-page" class="hidden min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-sm bg-zinc-950 p-10 rounded-2xl border border-white/5 shadow-2xl">
            <div class="text-center mb-10">
                <p class="text-blue-600 font-mono text-xs tracking-widest mb-2 uppercase">Authorized Only</p>
                <h2 class="text-3xl font-black italic">RIFQI GARAGE</h2>
            </div>
            <form id="login-form" class="space-y-4">
                <input type="text" placeholder="USERNAME" class="w-full bg-white/5 p-4 rounded border border-white/10 focus:border-blue-600 outline-none font-mono text-sm" required>
                <input type="password" placeholder="PASSWORD" class="w-full bg-white/5 p-4 rounded border border-white/10 focus:border-blue-600 outline-none font-mono text-sm" required>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded font-black tracking-tighter transition-all">ENTER SYSTEM</button>
            </form>
        </div>
    </div>

    <div id="main-content" class="hidden min-h-screen p-8">
        <header class="text-center mb-16">
            <h1 class="text-5xl font-black tracking-tighter">THE <span class="text-blue-600 italic">COLLECTION</span></h1>
            <p class="text-zinc-500 font-mono text-xs mt-2 uppercase tracking-[5px]">Created by Rifqi Nanda</p>
        </header>

        <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div onclick="showDetail('bmw')" class="car-card cursor-pointer bg-zinc-900 rounded-2xl overflow-hidden group">
                <div class="h-80 overflow-hidden">
                    <img src="https://i.postimg.cc/rp06wzjX/1200x900.jpg" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-black italic">M4 G82</h3>
                    <p class="text-blue-600 font-mono text-[10px] mt-1">LIHAT DETAIL &rarr;</p>
                </div>
            </div>

            <div onclick="showDetail('mercy')" class="car-card cursor-pointer bg-zinc-900 rounded-2xl overflow-hidden group">
                <div class="h-80 overflow-hidden">
                    <img src="https://i.postimg.cc/bYGPwC63/DSC-1755-768x512.jpg" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-black italic">C200</h3>
                    <p class="text-blue-600 font-mono text-[10px] mt-1">LIHAT DETAIL &rarr;</p>
                </div>
            </div>

            <div onclick="showDetail('audi')" class="car-card cursor-pointer bg-zinc-900 rounded-2xl overflow-hidden group">
                <div class="h-80 overflow-hidden">
                    <img src="https://i.postimg.cc/L8F27t3D/images-(4).jpg" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-black italic">RS6 AVANT</h3>
                    <p class="text-blue-600 font-mono text-[10px] mt-1">LIHAT DETAIL &rarr;</p>
                </div>
            </div>

            <div onclick="showDetail('bmwf82')" class="car-card cursor-pointer bg-zinc-900 rounded-2xl overflow-hidden group">
                <div class="h-80 overflow-hidden">
                    <img src="https://i.postimg.cc/1zRsH9yg/IMG-20260424-194022.jpg" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-black italic">M4 F82</h3>
                    <p class="text-blue-600 font-mono text-[10px] mt-1">LIHAT DETAIL &rarr;</p>
                </div>
            </div>
        </div>
    </div>

    <div id="detail-page" class="hidden">
        <div class="overlay-dark">
            <nav class="sticky top-0 p-6 z-50">
                <button onclick="goBack()" class="bg-blue-600/20 hover:bg-blue-600 border border-blue-500/50 px-6 py-2 rounded-full text-xs font-bold tracking-widest transition">
                    &larr; BACK TO GARAGE
                </button>
            </nav>
            <div id="detail-content" class="container mx-auto px-6 py-10"></div>
        </div>
    </div>

    <script>
        // --- ASSEMBLY LOADING LOGIC ---
        let count = 0;
        const countText = document.getElementById('count');
        const statusText = document.getElementById('status');

        const assemblyMessages = [
            "CALIBRATING WIREFRAME...",
            "ASSEMBLING CHASSIS...",
            "MOUNTING ENGINE...",
            "INSTALLING ELECTRICS...",
            "SYSTEM ACTIVE. WELCOME."
        ];

        const loadingInterval = setInterval(() => {
            count += Math.floor(Math.random() * 2) + 1; // Progres lambat untuk efek 'assembly'
            if (count > 100) count = 100;

            countText.innerText = count;

            // Ganti pesan status berdasarkan progres
            if (count < 20) statusText.innerText = assemblyMessages;
            else if (count < 45) statusText.innerText = assemblyMessages;
            else if (count < 70) statusText.innerText = assemblyMessages;
            else if (count < 95) statusText.innerText = assemblyMessages;
            else statusText.innerText = assemblyMessages;

            if (count === 100) {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    const ls = document.getElementById('loading-screen');
                    ls.style.opacity = '0';
                    ls.style.transition = '0.8s ease-out';
                    setTimeout(() => {
                        ls.style.display = 'none';
                        document.getElementById('login-page').classList.remove('hidden');
                    }, 800);
                }, 1000); // Menahan sebentar di 100%
            }
        }, 60);

        // --- LOGIN LOGIC ---
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('main-content').classList.add('page-enter');
            document.body.style.overflowY = "auto";
        });

        // --- DATA MOBIL ---
        const dataMobil = {
            bmw: {
                nama: "BMW M4 Competition (G82)",
                harga: "Rp 2.115.000.000,-",
                banner: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&q=80&w=1200",
                desc: "Mesin S58 Twin-Turbo dengan Kidney Grille agresif dan handling presisi tinggi.",
                specs: [["Mesin", "3.0L M TwinPower"], ["Tenaga", "510 HP"], ["0-100", "3.9 s"]]
            },
            mercy: {
                nama: "Mercedes-Benz C200 Avantgarde",
                harga: "Rp 1.060.000.000,-",
                banner: "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?auto=format&fit=crop&q=80&w=1200",
                desc: "Kemewahan kabin modern dengan teknologi MBUX terbaru dan kenyamanan superior.",
                specs: [["Mesin", "1.5L EQ Boost"], ["Tenaga", "204 HP"], ["Transmisi", "9G-TRONIC"]]
            },
            audi: {
                nama: "Audi RS6 Avant Quattro",
                harga: "Rp 3.550.000.000,-",
                banner: "https://images.unsplash.com/photo-1606152421702-427b45845536?auto=format&fit=crop&q=80&w=1200",
                desc: "Wagon tercepat di dunia yang menggabungkan fungsi keluarga dengan tenaga supercar.",
                specs: [["Mesin", "4.0L V8 Twin-Turbo"], ["Tenaga", "600 HP"], ["Sistem", "Quattro AWD"]]
            },
            bmwf82: {
                nama: "BMW M4 Coupe (F82)",
                harga: "Rp 1.450.000.000,-",
                banner: "https://i.postimg.cc/pX9Zm889/Snap-Tik-Net-7630022732620565780-7.jpg?auto=format&fit=crop&q=80&w=1200",
                desc: "Ikon sportscar modern dengan handling tajam dan siluet coupe legendaris.",
                specs: [["Mesin", "3.0L S55 Twin-Turbo"], ["Tenaga", "431 HP"], ["Atap", "Carbon Fiber"]]
            }
        };

        // --- NAVIGATION LOGIC ---
        function showDetail(key) {
            const mobil = dataMobil[key];
            const detailPage = document.getElementById('detail-page');
            const content = document.getElementById('detail-content');
            
            detailPage.style.backgroundImage = `url('${mobil.banner}')`;
            
            content.innerHTML = `
                <div class="animate-fade-in max-w-4xl mx-auto">
                    <div class="bg-black/80 backdrop-blur-md p-10 rounded-3xl border border-white/10">
                        <h2 class="text-6xl font-black italic text-blue-600 mb-2 uppercase">${mobil.nama}</h2>
                        <div class="h-1 w-20 bg-blue-600 mb-6"></div>
                        <p class="text-3xl font-bold mb-6">${mobil.harga}</p>
                        <p class="text-xl text-zinc-400 italic mb-10 border-l-4 border-blue-600 pl-6">"${mobil.desc}"</p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${mobil.specs.map(s => `
                                <div class="bg-white/5 p-6 rounded-2xl border border-white/5">
                                    <span class="text-zinc-500 block text-xs uppercase tracking-widest mb-1">${s}</span>
                                    <span class="text-xl font-bold uppercase">${s}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div class="mt-12 pt-10 border-t border-white/5 text-center">
                            <p class="text-zinc-500 font-mono text-[10px]">RIFQI NANDA PRIVATE COLLECTION © 2026</p>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('main-content').classList.add('hidden');
            detailPage.classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function goBack() {
            document.getElementById('detail-page').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
        }
    </script>
</body>
</html>
